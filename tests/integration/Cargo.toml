[package]
name = "quartz-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# cosmwasm
cosmwasm-std = { version = "3", features = ["std", "staking", "stargate"] }
cosmwasm-schema = "3"
cw-multi-test = { version = "3", features = ["stargate"] }
cw-storage-plus = "3"
cw2 = "3"

# quartz
quartz-contract-core = { path = "../../crates/contracts/core", features = ["mock-sgx"] }

# encoding
anyhow = "1"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
