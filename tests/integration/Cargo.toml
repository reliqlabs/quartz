[package]
name = "quartz-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# cosmwasm
cosmwasm-std = { version = "3", features = ["std", "staking", "stargate"] }
cosmwasm-schema = "3"
cw-multi-test = { version = "3", features = ["stargate", "cosmwasm_2_0"] }
cw-storage-plus = "3"
cw2 = "3"

# quartz — without mock so DstackAttestation handler queries ZK module
quartz-contract-core = { path = "../../crates/contracts/core" }
quartz-zkdcap = { path = "../../crates/zkdcap" }

# networking
ureq = { version = "2", features = ["json"] }

# encoding
anyhow = "1"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
