[package]
name = "quartz-contract-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["cryptography::cryptocurrencies", "wasm"]
keywords = ["cosmos", "cosmwasm", "quartz", "tee", "dstack"]
readme = "README.md"
description = """
A CosmWasm framework for securely interacting with TEE enclaves (dstack/TDX).
"""

[features]
default = []
mock = []
# DANGER: accept raw DstackAttestation quotes WITHOUT any on-chain verification.
# The raw-quote handler performs zero TDX verification, so the wrapper's only
# checks (user_data, compose_hash) compare host-supplied fields a malicious host
# can forge. Enabling this lets a host submit a forged attestation and, via the
# untagged DstackAnyAttestation fallback, downgrade a zkdcap-configured contract
# to no verification. Dev/test against a trusted host only; production builds
# MUST leave this off and use the zkdcap (DstackZkAttestation) path.
insecure-accept-raw-quote = []
std = ["k256/std", "serde/std", "serde_json/std", "sha2/std", "cosmwasm-std/std", "cosmwasm-std/stargate"]
library = []

[dependencies]
# external
hex.workspace = true
k256.workspace = true
prost = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

# quartz
quartz-zkdcap = { workspace = true, features = ["xion-backend"] }

# cosmos
cw-storage-plus.workspace = true
cosmwasm-schema.workspace = true
cosmwasm-std = { workspace = true, features = ["stargate", "cosmwasm_2_0"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(kani_slow)'] }

[dev-dependencies]
serde_json.workspace = true
