[package]
name = "quartz-cw-prover"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["command-line-utilities", "cryptography::cryptocurrencies", "wasm"]
keywords = ["cosmos", "cosmwasm", "quartz", "tee", "dstack"]
readme = "README.md"
description = """
CLI to generate a merkle proof of a key in the state of a CosmWasm contract.
"""

[dependencies]
# external
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true

# cosmos
cosmrs.workspace = true
tendermint.workspace = true
# Needs the HTTP transport (HttpClient); opt in explicitly, because the workspace
# default no longer carries `http-client` (it dragged a vulnerable TLS stack into
# type-only consumers like cw-proof).
tendermint-rpc = { workspace = true, features = ["http-client"] }

# quartz
quartz-cw-proof.workspace = true

[dev-dependencies]
hex.workspace = true
